<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="hbg" cx=".58" cy=".3" r=".9">
      <stop offset="0" stop-color="#32345c"/>
      <stop offset=".42" stop-color="#1c1c38"/>
      <stop offset="1" stop-color="#080912"/>
    </radialGradient>
    <radialGradient id="hmoon" cx=".36" cy=".3" r=".78">
      <stop offset="0" stop-color="#fff7dc"/>
      <stop offset=".52" stop-color="#f5dfb4"/>
      <stop offset=".82" stop-color="#d9b88d"/>
      <stop offset="1" stop-color="#b68f75"/>
    </radialGradient>
    <radialGradient id="hmoonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe8b8" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#ffd9a0" stop-opacity=".13"/>
      <stop offset="1" stop-color="#ffcf95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hhill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25233b"/>
      <stop offset="1" stop-color="#090a12"/>
    </linearGradient>
    <radialGradient id="hfire" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffdda0" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#ffb36b" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ff9255" stop-opacity="0"/>
    </radialGradient>
    <filter id="hblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="hblur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="hgrain">
      <feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
    </filter>
    <linearGradient id="hvig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040a" stop-opacity=".45"/>
      <stop offset=".3" stop-color="#03040a" stop-opacity="0"/>
      <stop offset=".78" stop-color="#03040a" stop-opacity="0"/>
      <stop offset="1" stop-color="#03040a" stop-opacity=".72"/>
    </linearGradient>
  </defs>

  <rect width="900" height="900" fill="url(#hbg)"/>

  <!-- moon glow and moon -->
  <circle cx="646" cy="258" r="290" fill="url(#hmoonGlow)"/>
  <circle cx="646" cy="258" r="160" fill="url(#hmoon)"/>
  <g fill="#b28e74" opacity=".18">
    <ellipse cx="604" cy="218" rx="26" ry="17"/>
    <ellipse cx="698" cy="300" rx="34" ry="20"/>
    <ellipse cx="632" cy="336" rx="18" ry="12"/>
    <ellipse cx="722" cy="200" rx="14" ry="10"/>
    <ellipse cx="574" cy="300" rx="10" ry="7"/>
  </g>
  <circle cx="646" cy="258" r="160" fill="none" stroke="#fff4d9" stroke-width="1.4" opacity=".35"/>

  <!-- stars -->
  <g fill="#dfe5ff">
    <circle cx="94" cy="98" r="2.3" opacity=".85"/>
    <circle cx="186" cy="184" r="1.5" opacity=".55"/>
    <circle cx="264" cy="80" r="2" opacity=".7"/>
    <circle cx="356" cy="150" r="1.5" opacity=".6"/>
    <circle cx="480" cy="92" r="2.4" opacity=".8"/>
    <circle cx="746" cy="116" r="1.8" opacity=".65"/>
    <circle cx="828" cy="226" r="2" opacity=".7"/>
    <circle cx="790" cy="430" r="1.6" opacity=".55"/>
    <circle cx="132" cy="346" r="1.8" opacity=".5"/>
    <circle cx="250" cy="416" r="1.4" opacity=".4"/>
    <circle cx="388" cy="300" r="1.5" opacity=".5"/>
    <circle cx="540" cy="220" r="1.4" opacity=".55"/>
    <circle cx="72" cy="260" r="1.2" opacity=".45"/>
    <circle cx="700" cy="60" r="1.6" opacity=".55"/>
    <circle cx="866" cy="90" r="1.3" opacity=".45"/>
  </g>
  <g fill="#fff1cf">
    <path d="M430 210l4 12 12 4-12 4-4 12-4-12-12-4 12-4z" opacity=".8"/>
    <path d="M218 240l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity=".55"/>
    <path d="M776 340l2.4 7 7 2.4-7 2.4-2.4 7-2.4-7-7-2.4 7-2.4z" opacity=".45"/>
  </g>

  <!-- shooting star -->
  <g opacity=".8">
    <path d="M126 322c74-64 142-94 222-110" fill="none" stroke="#eef2ff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M126 322c48-40 92-62 142-78" fill="none" stroke="#c9d5ff" stroke-width="1" stroke-linecap="round" opacity=".55"/>
    <circle cx="126" cy="322" r="3.2" fill="#fff"/>
    <circle cx="126" cy="322" r="15" fill="#e5ecff" opacity=".18" filter="url(#hblur2)"/>
  </g>

  <!-- distant mountains -->
  <path d="M0 668l126-128 98 82 92-140 106 144 96-72 88 90 104-126 96 100 94-60v252H0z" fill="#15162a" opacity=".9"/>
  <path d="M0 720l130-82 118 64 106-90 108 88 118-52 102 76 104-60 114 72v116H0z" fill="#0e0f1c" opacity=".9"/>

  <!-- hill -->
  <path d="M0 742c160-58 308-56 450-8 150 51 290 34 450-38v204H0z" fill="url(#hhill)"/>
  <path d="M0 792c160-38 318-28 462 10 150 40 282 28 438-18v116H0z" fill="#080910"/>

  <!-- warm fire glow behind couple -->
  <ellipse cx="432" cy="756" rx="180" ry="95" fill="url(#hfire)" opacity=".45" filter="url(#hblur)"/>

  <!-- couple sitting -->
  <g fill="#05060b">
    <!-- him -->
    <circle cx="400" cy="662" r="26"/>
    <path d="M380 692c12-10 30-11 43-2 10 7 14 21 14 38l-2 43h-65l-2-43c-1-18 4-30 12-36z"/>
    <path d="M392 716c-14 8-22 21-24 39" fill="none" stroke="#05060b" stroke-width="11" stroke-linecap="round"/>
    <!-- her -->
    <circle cx="466" cy="678" r="23"/>
    <path d="M452 696c-4-10 2-20 12-23 14-4 26 5 29 18 3 18 2 36 1 51l-1 29h-48l-2-31c-1-18 4-31 9-44z"/>
    <path d="M480 718c16 8 24 20 26 37" fill="none" stroke="#05060b" stroke-width="10" stroke-linecap="round"/>
    <path d="M427 707c11 9 24 12 37 6" fill="none" stroke="#05060b" stroke-width="12" stroke-linecap="round"/>
  </g>
  <path d="M381 640c-9 7-13 18-13 30" fill="none" stroke="#ffd8a6" stroke-width="2.4" opacity=".65" stroke-linecap="round"/>
  <path d="M485 660c7 9 10 19 9 30" fill="none" stroke="#ffd8a6" stroke-width="2.2" opacity=".55" stroke-linecap="round"/>

  <!-- blanket -->
  <path d="M360 754c40-10 98-8 142 6l-16 22c-42-9-77-9-112-2z" fill="#5e3b48" opacity=".7"/>

  <!-- fireflies / foreground -->
  <g fill="#ffe3b0">
    <circle cx="300" cy="744" r="3" opacity=".85"/>
    <circle cx="564" cy="718" r="2.4" opacity=".7"/>
    <circle cx="528" cy="782" r="2.2" opacity=".55"/>
    <circle cx="228" cy="808" r="2" opacity=".45"/>
    <circle cx="654" cy="790" r="2.4" opacity=".5"/>
  </g>
  <g stroke="#080910" fill="none" stroke-linecap="round">
    <path d="M96 900c2-42 9-70 22-96" stroke-width="4"/>
    <path d="M126 900c-2-30 4-54 17-74" stroke-width="3"/>
    <path d="M784 900c0-38 8-66 20-88" stroke-width="4"/>
    <path d="M756 900c-2-28 4-50 15-68" stroke-width="3"/>
  </g>

  <rect width="900" height="900" filter="url(#hgrain)" opacity=".48" style="mix-blend-mode:overlay"/>
  <rect width="900" height="900" fill="url(#hvig)"/>
</svg>
