<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="room04" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1d21"/>
      <stop offset=".55" stop-color="#3b2729"/>
      <stop offset="1" stop-color="#150f13"/>
    </linearGradient>
    <linearGradient id="window04" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5870"/>
      <stop offset=".45" stop-color="#476273"/>
      <stop offset=".72" stop-color="#8a716b"/>
      <stop offset="1" stop-color="#2c3039"/>
    </linearGradient>
    <linearGradient id="table04" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5241"/>
      <stop offset=".18" stop-color="#5d3b30"/>
      <stop offset="1" stop-color="#2b1a16"/>
    </linearGradient>
    <linearGradient id="cup04" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e3d2"/>
      <stop offset="1" stop-color="#bfa48d"/>
    </linearGradient>
    <radialGradient id="lamp04" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffcf8f" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#ffb06c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff9a5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh04" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd8a3" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#ffb477" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ff9b62" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur04" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="blur04b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="35"/></filter>
    <filter id="grain04">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".17"/></feComponentTransfer>
    </filter>
    <linearGradient id="vig04" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050309" stop-opacity=".6"/>
      <stop offset=".3" stop-color="#050309" stop-opacity="0"/>
      <stop offset=".8" stop-color="#050309" stop-opacity="0"/>
      <stop offset="1" stop-color="#050309" stop-opacity=".8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1125" fill="url(#room04)"/>
  <ellipse cx="640" cy="280" rx="380" ry="330" fill="#e5a56a" opacity=".08" filter="url(#blur04b)"/>

  <!-- window frame -->
  <rect x="88" y="108" width="724" height="706" rx="8" fill="#1a1215"/>
  <rect x="108" y="128" width="684" height="666" rx="4" fill="url(#window04)"/>

  <!-- outside bokeh -->
  <g opacity=".85" filter="url(#blur04)">
    <circle cx="220" cy="430" r="52" fill="url(#bokeh04)"/>
    <circle cx="318" cy="560" r="38" fill="url(#bokeh04)" opacity=".8"/>
    <circle cx="650" cy="390" r="66" fill="url(#bokeh04)" opacity=".75"/>
    <circle cx="726" cy="540" r="41" fill="url(#bokeh04)" opacity=".6"/>
    <circle cx="520" cy="690" r="58" fill="url(#bokeh04)" opacity=".5"/>
    <ellipse cx="460" cy="230" rx="240" ry="120" fill="#9db8c8" opacity=".16"/>
    <ellipse cx="650" cy="740" rx="230" ry="70" fill="#eab27e" opacity=".15"/>
  </g>

  <!-- city silhouette outside -->
  <g fill="#202c3a" opacity=".7">
    <path d="M108 600h60v-90h48v90h44v-130h55v130h60v-76h45v76h54v-100h66v100h50v-58h50v58h68v194H108z"/>
  </g>
  <g fill="#f1c184" opacity=".6">
    <rect x="130" y="548" width="10" height="13"/>
    <rect x="182" y="530" width="8" height="11"/>
    <rect x="250" y="558" width="9" height="12"/>
    <rect x="382" y="530" width="9" height="12"/>
    <rect x="440" y="570" width="8" height="11"/>
    <rect x="584" y="550" width="9" height="12"/>
    <rect x="708" y="566" width="8" height="11"/>
  </g>

  <!-- window mullions -->
  <g fill="#23171b">
    <rect x="444" y="128" width="12" height="666"/>
    <rect x="108" y="446" width="684" height="10"/>
    <rect x="88" y="108" width="724" height="20"/>
    <rect x="88" y="794" width="724" height="20"/>
  </g>
  <g fill="#4d5b66" opacity=".5">
    <rect x="452" y="128" width="3" height="666"/>
    <rect x="108" y="453" width="684" height="3"/>
  </g>

  <!-- rain on glass -->
  <g stroke="#d7e4ea" fill="none" stroke-linecap="round" opacity=".5">
    <path d="M180 180v54" stroke-width="2"/>
    <path d="M250 250v82" stroke-width="1.6"/>
    <path d="M330 166v36" stroke-width="1.4"/>
    <path d="M392 340v66" stroke-width="2"/>
    <path d="M540 206v94" stroke-width="1.7"/>
    <path d="M626 320v48" stroke-width="1.4"/>
    <path d="M700 226v70" stroke-width="2"/>
    <path d="M742 410v54" stroke-width="1.5"/>
    <path d="M220 520v72" stroke-width="1.8"/>
    <path d="M344 600v42" stroke-width="1.4"/>
    <path d="M580 560v88" stroke-width="1.7"/>
    <path d="M160 640v50" stroke-width="1.5"/>
  </g>
  <g fill="#d7e4ea" opacity=".5">
    <ellipse cx="250" cy="334" rx="3" ry="5"/>
    <ellipse cx="392" cy="408" rx="3.4" ry="6"/>
    <ellipse cx="540" cy="302" rx="3" ry="5"/>
    <ellipse cx="700" cy="298" rx="3.2" ry="5.5"/>
    <ellipse cx="580" cy="650" rx="3" ry="5"/>
    <ellipse cx="220" cy="594" rx="3" ry="5"/>
    <ellipse cx="742" cy="466" rx="2.6" ry="4.4"/>
  </g>
  <g stroke="#e5eef2" fill="none" stroke-width="1" opacity=".22">
    <path d="M130 210c50-18 80 4 120-6"/>
    <path d="M480 380c60-14 96 8 132-8"/>
    <path d="M180 690c40-10 68 8 98 0"/>
  </g>

  <!-- window sill -->
  <rect x="70" y="800" width="760" height="44" rx="6" fill="#382326"/>
  <rect x="70" y="800" width="760" height="8" rx="4" fill="#a06d56" opacity=".35"/>

  <!-- table -->
  <path d="M0 1030c150-40 350-54 450-48 170 10 320 28 450 10v133H0z" fill="url(#table04)"/>
  <ellipse cx="450" cy="1040" rx="400" ry="55" fill="#000" opacity=".25" filter="url(#blur04b)"/>
  <path d="M0 1040c180-26 340-33 460-28" stroke="#b37b5b" stroke-width="2" opacity=".28"/>

  <!-- hanging lamp -->
  <g>
    <path d="M714 0v150" stroke="#171014" stroke-width="5"/>
    <path d="M672 150h84l-18 68h-48z" fill="#21161a"/>
    <ellipse cx="714" cy="218" rx="18" ry="24" fill="#ffdca4"/>
    <ellipse cx="714" cy="226" rx="150" ry="140" fill="url(#lamp04)" opacity=".6" filter="url(#blur04b)"/>
  </g>

  <!-- two cups -->
  <g>
    <ellipse cx="376" cy="1015" rx="92" ry="20" fill="#100a0d" opacity=".45"/>
    <ellipse cx="376" cy="1005" rx="86" ry="18" fill="#d9c1a7" opacity=".55"/>
    <path d="M314 936c0-12 9-20 22-20h80c13 0 22 8 22 20l-9 60c-2 12-10 18-22 18h-62c-12 0-20-6-22-18z" fill="url(#cup04)"/>
    <ellipse cx="376" cy="936" rx="62" ry="17" fill="#fbf0df"/>
    <ellipse cx="376" cy="936" rx="50" ry="12" fill="#5d392b"/>
    <ellipse cx="376" cy="933" rx="37" ry="8" fill="#c18d66" opacity=".65"/>
    <path d="M438 946c28-2 38 12 33 28-4 14-16 20-33 16" fill="none" stroke="#d8bea8" stroke-width="11" stroke-linecap="round"/>
    <g stroke="#f5e4ce" fill="none" stroke-linecap="round" opacity=".36">
      <path d="M356 900c-10-22 14-30 4-52" stroke-width="5"/>
      <path d="M384 892c-8-18 12-26 5-44" stroke-width="4"/>
      <path d="M408 902c-7-16 11-22 5-38" stroke-width="3.4"/>
    </g>
  </g>
  <g>
    <ellipse cx="566" cy="1040" rx="80" ry="17" fill="#100a0d" opacity=".4"/>
    <ellipse cx="566" cy="1032" rx="74" ry="15" fill="#d3b89d" opacity=".5"/>
    <path d="M512 970c0-10 8-17 19-17h68c11 0 19 7 19 17l-7 48c-2 10-9 15-19 15h-54c-10 0-17-5-19-15z" fill="url(#cup04)"/>
    <ellipse cx="566" cy="970" rx="53" ry="14" fill="#fbf0df"/>
    <ellipse cx="566" cy="970" rx="43" ry="10" fill="#5d392b"/>
    <path d="M618 978c24-2 32 10 28 23-4 11-14 16-28 13" fill="none" stroke="#d8bea8" stroke-width="9" stroke-linecap="round"/>
    <g stroke="#f5e4ce" fill="none" stroke-linecap="round" opacity=".3">
      <path d="M548 940c-8-18 11-24 4-42" stroke-width="4"/>
      <path d="M574 934c-6-14 10-20 4-34" stroke-width="3.4"/>
    </g>
  </g>

  <!-- book -->
  <g transform="rotate(-8 730 990)">
    <rect x="676" y="956" width="122" height="84" rx="5" fill="#563137"/>
    <rect x="684" y="963" width="114" height="74" rx="4" fill="#d7b38f"/>
    <path d="M684 1000h114" stroke="#8c644b" stroke-width="2"/>
    <path d="M694 980h38M694 990h30M694 1012h48M694 1022h32" stroke="#9b775d" stroke-width="2" opacity=".55"/>
  </g>

  <!-- plant -->
  <g>
    <path d="M806 930c-20-30-24-74-4-112 24 30 26 76 4 112z" fill="#3b4a39"/>
    <path d="M792 922c-30-8-50-32-54-66 34 8 52 32 54 66z" fill="#45563f"/>
    <path d="M818 918c26-12 38-36 38-66-28 12-38 36-38 66z" fill="#334432"/>
    <path d="M780 924h48l-7 90h-34z" fill="#6d4439"/>
    <path d="M776 924h56v12h-56z" fill="#83564a"/>
  </g>

  <rect width="900" height="1125" filter="url(#grain04)" opacity=".5" style="mix-blend-mode:overlay"/>
  <rect width="900" height="1125" fill="url(#vig04)"/>
</svg>
