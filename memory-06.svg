<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky06" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35405f"/>
      <stop offset=".32" stop-color="#7c7085"/>
      <stop offset=".56" stop-color="#d79a8c"/>
      <stop offset=".76" stop-color="#f6c08d"/>
      <stop offset="1" stop-color="#ffe0aa"/>
    </linearGradient>
    <radialGradient id="sun06" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffde9"/>
      <stop offset=".24" stop-color="#fff0c0"/>
      <stop offset=".55" stop-color="#ffcd91" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb47c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill06" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77676c"/>
      <stop offset="1" stop-color="#3b3745"/>
    </linearGradient>
    <linearGradient id="field06" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d5b4b"/>
      <stop offset=".5" stop-color="#3a3b32"/>
      <stop offset="1" stop-color="#191a16"/>
    </linearGradient>
    <linearGradient id="road06" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e7a6c"/>
      <stop offset=".45" stop-color="#4c423d"/>
      <stop offset="1" stop-color="#1c1918"/>
    </linearGradient>
    <filter id="blur06" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft06" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="grain06">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
    </filter>
    <linearGradient id="vig06" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05040a" stop-opacity=".5"/>
      <stop offset=".3" stop-color="#05040a" stop-opacity="0"/>
      <stop offset=".8" stop-color="#05040a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05040a" stop-opacity=".75"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1125" fill="url(#sky06)"/>
  <circle cx="470" cy="590" r="330" fill="url(#sun06)"/>
  <circle cx="470" cy="590" r="86" fill="#fff3cb"/>

  <!-- clouds -->
  <g fill="#f7d3bb" opacity=".28" filter="url(#soft06)">
    <ellipse cx="200" cy="420" rx="240" ry="22"/>
    <ellipse cx="690" cy="500" rx="260" ry="18"/>
    <ellipse cx="380" cy="330" rx="160" ry="14"/>
    <ellipse cx="760" cy="300" rx="160" ry="12"/>
  </g>
  <g fill="#6d5570" opacity=".3" filter="url(#soft06)">
    <ellipse cx="180" cy="520" rx="250" ry="16"/>
    <ellipse cx="700" cy="560" rx="230" ry="12"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#3a3040" stroke-width="3.6" stroke-linecap="round" opacity=".7">
    <path d="M196 334c14-10 23-10 37 0 14-10 23-10 37 0"/>
    <path d="M666 252c10-7 16-7 26 0 10-7 16-7 26 0"/>
    <path d="M584 300c7-5 12-5 19 0 7-5 12-5 19 0"/>
  </g>

  <!-- hills -->
  <path d="M0 720c150-80 270-96 410-50 150 48 290 32 490-42v290H0z" fill="#8d7073" opacity=".65"/>
  <path d="M0 790c120-70 250-74 380-30 150 50 320 36 520-30v240H0z" fill="url(#hill06)" opacity=".8"/>

  <!-- fields -->
  <path d="M0 870c180-40 340-30 470 0 150 34 280 26 430-14v269H0z" fill="url(#field06)"/>

  <!-- road -->
  <path d="M396 1125c18-156 46-274 74-362 20-64 10-124-12-182 38 62 54 128 48 200-9 102-20 211-24 344z" fill="url(#road06)"/>
  <path d="M470 1125c-2-148 6-270 28-368" fill="none" stroke="#f5d2a4" stroke-width="7" stroke-dasharray="34 30" opacity=".55"/>
  <path d="M398 1125c16-152 44-266 72-354" fill="none" stroke="#f3cfae" stroke-width="2" opacity=".2"/>

  <!-- field texture -->
  <g stroke="#a99670" fill="none" opacity=".18" stroke-linecap="round">
    <path d="M40 1000c80-26 150-32 230-22" stroke-width="2"/>
    <path d="M640 960c80-24 150-24 220-8" stroke-width="2"/>
    <path d="M60 1080c100-24 180-28 260-14" stroke-width="1.6"/>
    <path d="M680 1060c70-16 130-14 190-2" stroke-width="1.6"/>
  </g>

  <!-- couple walking away -->
  <g fill="#100d12">
    <circle cx="439" cy="860" r="20"/>
    <path d="M420 885c10-8 26-8 37 0 9 7 13 20 14 36l1 58h-59l-3-58c-2-17 2-29 10-36z"/>
    <path d="M432 909l-17 53M455 909l16 53" stroke="#100d12" stroke-width="9" stroke-linecap="round"/>
    <circle cx="486" cy="872" r="18"/>
    <path d="M471 893c-3-9 2-17 10-20 12-4 23 4 26 16 3 16 3 34 2 50l-1 40h-46l-2-42c-1-16 5-31 11-44z"/>
    <path d="M478 916l-13 48M498 916l12 48" stroke="#100d12" stroke-width="8" stroke-linecap="round"/>
    <path d="M456 904c10 6 19 6 28 1" fill="none" stroke="#100d12" stroke-width="8" stroke-linecap="round"/>
  </g>
  <path d="M422 849c-7 6-10 15-10 24" fill="none" stroke="#ffd7a2" stroke-width="2.2" opacity=".7" stroke-linecap="round"/>
  <path d="M500 862c5 7 7 15 6 24" fill="none" stroke="#ffd7a2" stroke-width="2" opacity=".55" stroke-linecap="round"/>

  <!-- foreground flowers -->
  <g>
    <g stroke="#1d2419" stroke-width="3" fill="none">
      <path d="M80 1125c0-50 10-86 30-112"/>
      <path d="M120 1125c-4-38 4-68 20-90"/>
      <path d="M800 1125c2-44 12-76 28-100"/>
      <path d="M760 1125c-2-34 5-62 18-82"/>
    </g>
    <g fill="#e7b090" opacity=".8">
      <circle cx="109" cy="1010" r="8"/>
      <circle cx="98" cy="1020" r="6"/>
      <circle cx="120" cy="1024" r="6"/>
      <circle cx="110" cy="1032" r="5"/>
      <circle cx="830" cy="1022" r="7"/>
      <circle cx="819" cy="1030" r="5.5"/>
      <circle cx="841" cy="1032" r="5"/>
    </g>
    <g fill="#f7d7a7">
      <circle cx="109" cy="1020" r="3.2"/>
      <circle cx="830" cy="1030" r="3"/>
    </g>
  </g>

  <!-- light rays -->
  <g opacity=".14" filter="url(#blur06)">
    <path d="M470 590L210 1125h90z" fill="#ffddb0"/>
    <path d="M470 590L650 1125h80z" fill="#ffddb0"/>
  </g>

  <rect width="900" height="1125" filter="url(#grain06)" opacity=".47" style="mix-blend-mode:overlay"/>
  <rect width="900" height="1125" fill="url(#vig06)"/>
</svg>
