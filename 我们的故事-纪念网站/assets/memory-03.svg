<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg03" cx=".52" cy=".42" r=".8">
      <stop offset="0" stop-color="#583044"/>
      <stop offset=".45" stop-color="#2e1a2b"/>
      <stop offset="1" stop-color="#0d0912"/>
    </radialGradient>
    <linearGradient id="cake03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d9bd"/>
      <stop offset=".5" stop-color="#ddb291"/>
      <stop offset="1" stop-color="#b67b64"/>
    </linearGradient>
    <linearGradient id="cream03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3df"/>
      <stop offset="1" stop-color="#f1d0b5"/>
    </linearGradient>
    <linearGradient id="plate03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c3b44"/>
      <stop offset="1" stop-color="#24151e"/>
    </linearGradient>
    <radialGradient id="flame03" cx=".5" cy=".65" r=".55">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset=".38" stop-color="#ffd98c"/>
      <stop offset=".72" stop-color="#ff9a55" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ff7b45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh03" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd49b" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#ffae7d" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff9b76" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur03" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="soft03" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="grain03">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
    </filter>
    <linearGradient id="vig03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030a" stop-opacity=".66"/>
      <stop offset=".32" stop-color="#05030a" stop-opacity="0"/>
      <stop offset=".82" stop-color="#05030a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05030a" stop-opacity=".78"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1125" fill="url(#bg03)"/>
  <ellipse cx="450" cy="420" rx="390" ry="310" fill="#b06376" opacity=".13" filter="url(#blur03)"/>

