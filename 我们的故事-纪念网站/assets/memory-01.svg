<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky01" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#15142d"/>
      <stop offset=".38" stop-color="#433251"/>
      <stop offset=".68" stop-color="#9b5361"/>
      <stop offset=".88" stop-color="#e59472"/>
      <stop offset="1" stop-color="#f6c18e"/>
    </linearGradient>
    <radialGradient id="glow01" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe0b0" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#ffb877" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff9b6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground01" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b31"/>
      <stop offset="1" stop-color="#0d0a16"/>
    </linearGradient>
    <linearGradient id="vignette01" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05040b" stop-opacity=".55"/>
      <stop offset=".3" stop-color="#05040b" stop-opacity="0"/>
      <stop offset=".75" stop-color="#05040b" stop-opacity="0"/>
      <stop offset="1" stop-color="#05040b" stop-opacity=".72"/>
    </linearGradient>
    <filter id="blur01" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="soft01" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="grain01">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".17"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#sky01)"/>

  <!-- distant sunset haze -->
  <ellipse cx="690" cy="735" rx="340" ry="250" fill="url(#glow01)" opacity=".75"/>
  <circle cx="690" cy="712" r="64" fill="#ffe7c2" opacity=".92"/>
  <circle cx="690" cy="712" r="110" fill="#ffd7a6" opacity=".12" filter="url(#blur01)"/>

  <!-- clouds -->
  <g fill="#f7c5a2" opacity=".13" filter="url(#soft01)">
    <ellipse cx="250" cy="590" rx="250" ry="22"/>
    <ellipse cx="680" cy="520" rx="190" ry="16"/>
    <ellipse cx="480" cy="660" rx="330" ry="19"/>
  </g>

  <!-- skyline -->
  <g fill="#20172b" opacity=".82">
    <path d="M0 842h84v-92h54v92h80v-150h58v150h92v-64h64v64h78v-120h70v120h92v-78h74v78h156v283H0z"/>
  </g>
  <g fill="#3a2438" opacity=".6">
    <path d="M40 842v-62h46v62zM210 842v-96h52v96zM500 842v-80h48v80zM680 842v-58h44v58zM780 842v-106h50v106z"/>
  </g>
  <g fill="#ffd9a0">
    <rect x="60" y="802" width="7" height="10" opacity=".7"/>
    <rect x="88" y="820" width="7" height="10" opacity=".45"/>
    <rect x="228" y="776" width="7" height="10" opacity=".6"/>
    <rect x="250" y="800" width="7" height="10" opacity=".35"/>
    <rect x="512" y="790" width="7" height="10" opacity=".55"/>
    <rect x="704" y="806" width="7" height="10" opacity=".5"/>
    <rect x="796" y="766" width="7" height="10" opacity=".65"/>
  </g>

  <!-- ground -->
  <path d="M0 870c190-30 320 10 450 4 150-7 280-42 450-4v255H0z" fill="url(#ground01)"/>
  <ellipse cx="305" cy="1018" rx="250" ry="30" fill="#f5a56e" opacity=".13" filter="url(#blur01)"/>

  <!-- streetlamp -->
  <g>
    <path d="M218 1040V520c0-58 46-92 106-92h58" fill="none" stroke="#100d1a" stroke-width="13" stroke-linecap="round"/>
    <path d="M382 428v34" stroke="#100d1a" stroke-width="8"/>
    <path d="M346 462h72l-10 44h-52z" fill="#100d1a"/>
    <ellipse cx="382" cy="478" rx="16" ry="24" fill="#ffe2ad"/>
    <ellipse cx="382" cy="478" rx="58" ry="74" fill="url(#glow01)" opacity=".8"/>
    <path d="M210 1040h18" stroke="#100d1a" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- couple silhouette -->
  <g fill="#120e1c">
    <!-- him -->
    <circle cx="470" cy="746" r="38"/>
    <path d="M430 790c14-18 33-27 55-25 24 3 39 15 47 37 12 36 20 92 21 132l-14 92h-39l-7-89-22 89h-45l7-120c1-51 4-93-3-116z"/>
    <path d="M455 770c-20 22-23 58-19 92l20 50" fill="none" stroke="#120e1c" stroke-width="22" stroke-linecap="round"/>
    <!-- her -->
    <circle cx="554" cy="760" r="33"/>
    <path d="M532 742c-6 25 0 42 12 48 17 9 42-2 52-24 3 38 9 58 16 77 10 28 13 64 12 106l-5 84h-94l-3-90c-1-43 7-85 10-201z"/>
    <path d="M535 800c17 15 37 27 45 45 8 18 5 37 5 37" fill="none" stroke="#120e1c" stroke-width="20" stroke-linecap="round"/>
    <path d="M566 784c-22 9-26 29-18 51 5 15 13 26 17 42" fill="none" stroke="#f7b083" stroke-width="3" opacity=".42"/>
  </g>
  <!-- warm rim light -->
  <path d="M498 719c-24 12-35 35-40 58" fill="none" stroke="#ffd7a7" stroke-width="3" opacity=".6" stroke-linecap="round"/>
  <path d="M596 739c11 21 18 48 22 77" fill="none" stroke="#ffd7a7" stroke-width="2.5" opacity=".45" stroke-linecap="round"/>

  <!-- reflection / light pool -->
  <ellipse cx="500" cy="1004" rx="210" ry="45" fill="#f4a776" opacity=".08" filter="url(#blur01)"/>

  <!-- fireflies -->
  <g fill="#ffe5b4">
    <circle cx="330" cy="900" r="3" opacity=".85"/>
    <circle cx="660" cy="880" r="2.4" opacity=".6"/>
    <circle cx="740" cy="966" r="2" opacity=".5"/>
    <circle cx="280" cy="960" r="2" opacity=".5"/>
    <circle cx="620" cy="1012" r="2.6" opacity=".75"/>
  </g>

  <rect width="900" height="1125" filter="url(#grain01)" opacity=".48" style="mix-blend-mode:overlay"/>
  <rect width="900" height="1125" fill="url(#vignette01)"/>
</svg>
