<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky05" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090d1f"/>
      <stop offset=".42" stop-color="#17223f"/>
      <stop offset=".72" stop-color="#31415d"/>
      <stop offset=".9" stop-color="#6b5a64"/>
      <stop offset="1" stop-color="#a9786c"/>
    </linearGradient>
    <radialGradient id="milky05" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a9b8df" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#8b9ecb" stop-opacity=".14"/>
      <stop offset="1" stop-color="#7d8fbb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtnFar05" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3a55"/>
      <stop offset="1" stop-color="#151c30"/>
    </linearGradient>
    <linearGradient id="mtnNear05" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b2b"/>
      <stop offset="1" stop-color="#090b15"/>
    </linearGradient>
    <linearGradient id="lake05" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263350"/>
      <stop offset=".5" stop-color="#111a2c"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <radialGradient id="fire05" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#ffb05f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7d3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tent05" cx=".5" cy=".6" r=".6">
      <stop offset="0" stop-color="#ffd18b" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#e28e54" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e28e54" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur05" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur05b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="grain05">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".17"/></feComponentTransfer>
    </filter>
    <linearGradient id="vig05" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04050c" stop-opacity=".55"/>
      <stop offset=".3" stop-color="#04050c" stop-opacity="0"/>
      <stop offset=".8" stop-color="#04050c" stop-opacity="0"/>
      <stop offset="1" stop-color="#04050c" stop-opacity=".75"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1125" fill="url(#sky05)"/>
  <ellipse cx="470" cy="350" rx="500" ry="260" fill="url(#milky05)" transform="rotate(-25 470 350)" filter="url(#blur05b)"/>

  <!-- stars -->
  <g fill="#dfe6ff">
    <circle cx="120" cy="120" r="2.6" opacity=".9"/>
    <circle cx="210" cy="210" r="1.8" opacity=".6"/>
    <circle cx="300" cy="90" r="2.2" opacity=".8"/>
    <circle cx="410" cy="180" r="1.5" opacity=".55"/>
    <circle cx="500" cy="112" r="2.8" opacity=".9"/>
    <circle cx="610" cy="250" r="1.7" opacity=".6"/>
    <circle cx="700" cy="140" r="2.4" opacity=".85"/>
    <circle cx="790" cy="300" r="1.6" opacity=".6"/>
    <circle cx="820" cy="90" r="2" opacity=".7"/>
    <circle cx="740" cy="400" r="1.8" opacity=".55"/>
    <circle cx="160" cy="380" r="1.6" opacity=".5"/>
    <circle cx="260" cy="470" r="1.4" opacity=".4"/>
    <circle cx="360" cy="330" r="2" opacity=".6"/>
    <circle cx="550" cy="420" r="1.5" opacity=".45"/>
    <circle cx="640" cy="520" r="1.7" opacity=".45"/>
    <circle cx="90" cy="520" r="1.8" opacity=".4"/>
    <circle cx="450" cy="60" r="1.4" opacity=".5"/>
    <circle cx="670" cy="80" r="1.3" opacity=".55"/>
  </g>
  <g fill="#fff2d2">
    <path d="M492 250l4 12 12 4-12 4-4 12-4-12-12-4 12-4z" opacity=".8"/>
    <path d="M170 300l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity=".55"/>
    <path d="M760 210l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".5"/>
  </g>
  <g fill="none" stroke="#e9efff" stroke-linecap="round" opacity=".55">
    <path d="M600 110c30-14 54-10 78 8" stroke-width="2"/>
    <path d="M580 98c10-4 18-4 26 0" stroke-width="1.2" opacity=".6"/>
  </g>
  <circle cx="688" cy="112" r="3" fill="#fff" opacity=".9"/>
  <circle cx="688" cy="112" r="20" fill="#dfe8ff" opacity=".14" filter="url(#blur05)"/>

  <!-- mountains far -->
  <path d="M0 720l120-180 95 96 90-140 120 160 85-86 100 116 90-152 100 146 100-72v400H0z" fill="url(#mtnFar05)" opacity=".85"/>
  <path d="M0 760l150-150 120 120 100-90 115 130 100-60 130 120 95-70 90 70v300H0z" fill="#111827" opacity=".7"/>

  <!-- lake -->
  <path d="M0 815c170-34 300-38 450-20 180 21 300 22 450 10v320H0z" fill="url(#lake05)"/>
  <g stroke="#9caed6" opacity=".2" fill="none" stroke-linecap="round">
    <path d="M180 860c70 4 120 4 190 0" stroke-width="2"/>
    <path d="M460 890c80 4 150 4 230 0" stroke-width="1.8"/>
    <path d="M260 940c60 3 110 3 170 0" stroke-width="1.5"/>
    <path d="M560 980c70 3 130 3 200 0" stroke-width="1.4"/>
  </g>
  <g stroke="#ffd9a1" opacity=".25" fill="none" stroke-linecap="round">
    <path d="M360 900c30 2 50 2 80 0" stroke-width="2"/>
    <path d="M330 930c26 2 44 2 66 0" stroke-width="1.6"/>
  </g>

  <!-- near ground -->
  <path d="M0 935c180-28 360-26 470-8 150 24 270 20 430-4v202H0z" fill="url(#mtnNear05)"/>
  <path d="M0 980c170-20 320-14 470 2 130 14 270 10 430-12v155H0z" fill="#070910"/>

  <!-- tent -->
  <g>
    <ellipse cx="650" cy="1006" rx="180" ry="60" fill="url(#tent05)" opacity=".45" filter="url(#blur05b)"/>
    <path d="M560 928c10-74 26-134 54-176 22 44 34 100 34 176z" fill="#b26c4e"/>
    <path d="M614 752c25 44 38 101 38 176h-46c0-78-3-135 8-176z" fill="#d89164"/>
    <path d="M581 928c8-56 18-101 33-134 14 35 21 80 21 134z" fill="#f0b878" opacity=".85"/>
    <path d="M612 794l22 134h-40z" fill="#2b1a19" opacity=".8"/>
    <path d="M552 928h122l-8 18H560z" fill="#221713"/>
    <path d="M540 946h150" stroke="#392018" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- campfire between tent and couple -->
  <g>
    <ellipse cx="388" cy="1032" rx="110" ry="34" fill="url(#fire05)" opacity=".75" filter="url(#blur05)"/>
    <path d="M344 1035l44-22 44 22-44 13z" fill="#2a1a14"/>
    <path d="M352 1030l36-14 36 14-36 10z" fill="#5b3320"/>
    <path d="M388 976c18 24 28 38 28 54 0 16-12 26-28 26s-28-10-28-26c0-16 10-31 28-54z" fill="#ffb04f"/>
    <path d="M388 998c9 14 14 22 14 31 0 8-6 14-14 14s-14-6-14-14c0-9 5-18 14-31z" fill="#ffe6a6"/>
    <g fill="#ffbf68">
      <circle cx="358" cy="992" r="3" opacity=".8"/>
      <circle cx="424" cy="978" r="2.4" opacity=".7"/>
      <circle cx="410" cy="1040" r="2.2" opacity=".55"/>
    </g>
  </g>

  <!-- couple silhouettes sitting -->
  <g fill="#07080f">
    <circle cx="276" cy="968" r="25"/>
    <path d="M256 998c12-10 29-11 42-2 9 7 12 21 11 38l-3 46h-59l-2-45c-1-17 3-30 11-37z"/>
    <circle cx="330" cy="982" r="21"/>
    <path d="M316 1000c-4-11 3-20 12-23 14-4 25 5 28 18 2 18 1 36 0 50l-1 35h-44l-1-38c0-17 3-30 6-42z"/>
  </g>
  <path d="M292 948c-8 6-11 16-12 26" fill="none" stroke="#f2b47f" stroke-width="2.2" opacity=".55" stroke-linecap="round"/>
  <path d="M343 966c6 8 8 18 8 28" fill="none" stroke="#f2b47f" stroke-width="2" opacity=".45" stroke-linecap="round"/>

  <!-- foreground grass -->
  <g stroke="#080b13" fill="none" stroke-linecap="round">
    <path d="M80 1125c4-40 10-64 22-86" stroke-width="4"/>
    <path d="M106 1125c-2-34 5-56 20-76" stroke-width="3"/>
    <path d="M820 1125c-3-36-10-60-22-82" stroke-width="4"/>
    <path d="M790 1125c4-30-2-52-15-72" stroke-width="3"/>
  </g>

  <rect width="900" height="1125" filter="url(#grain05)" opacity=".47" style="mix-blend-mode:overlay"/>
  <rect width="900" height="1125" fill="url(#vig05)"/>
</svg>
